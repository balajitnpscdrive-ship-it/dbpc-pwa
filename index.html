<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>G.O.A.T.S | PLATINUM TERMINAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;600;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --bg: #030712; --card: rgba(15, 23, 42, 0.98); --accent: #00f2fe; --house-col: #00f2fe; --gold: #fdbb2d; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; font-family: 'Outfit', sans-serif; min-height: 100vh; overflow-x: hidden; }
        .award-poster { width: 350px; min-height: 580px; margin: 20px auto; background: radial-gradient(circle at center, #1b2735 0%, #050b1a 100%); border-radius: 20px; padding: 35px 25px; box-shadow: 0 40px 100px rgba(0,0,0,0.8); position: relative; border: 1px solid rgba(255,255,255,0.08); text-align: center; }
        .clg-title { font-family: 'Bebas Neue'; font-size: 20px; line-height: 1.1; }
        .award-main-title { font-family: 'Bebas Neue'; font-size: 45px; line-height: 0.85; margin: 15px 0; }
        .portrait-zone { width: 170px; height: 170px; margin: 30px auto; position: relative; }
        .portrait-ring { position: absolute; inset: -12px; border: 4px solid var(--house-col); border-radius: 50%; box-shadow: 0 0 35px var(--house-col); animation: ringPulse 3s infinite; }
        @keyframes ringPulse { 0%,100%{transform:scale(1);opacity:0.6} 50%{transform:scale(1.05);opacity:1} }
        .portrait-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 5px solid #fff; position: relative; z-index: 5; background: #111; }
        .winner-banner { background: var(--gold); color: #000; font-family: 'Bebas Neue'; font-size: 38px; letter-spacing: 6px; padding: 12px 45px; clip-path: polygon(10% 0, 90% 0, 100% 50%, 90% 100%, 10% 100%, 0 50%); }
        .bold-bar-container { height: 22px; background: rgba(255,255,255,0.05); border-radius: 11px; overflow: hidden; position: relative; margin-top: 8px; }
        .bold-bar-fill { height: 100%; border-radius: 11px; transition: width 2s cubic-bezier(0.1, 0, 0, 1); box-shadow: 0 0 15px var(--house-col); }
        .glass { background: var(--card); backdrop-filter: blur(30px); border-radius: 35px; padding: 25px; border: 1px solid rgba(255,255,255,0.08); margin-bottom: 25px; }
        .btn-elite { background: linear-gradient(135deg, var(--gold), #fff); color: #000; border: none; padding: 22px; border-radius: 25px; width: 100%; font-family: 'Bebas Neue'; font-size: 30px; cursor: pointer; }
        #splash { position: fixed; inset: 0; background: #000; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 1s; }
        .splash-img { width: 140px; height: 140px; border-radius: 50%; border: 3px solid var(--accent); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
    </style>
</head>
<body>
    <div id="splash"><img id="sp-img" class="splash-img"><h1 style="font-family:'Bebas Neue'; letter-spacing:10px; margin-top:30px; font-size:45px;">SYNCING ARENA...</h1></div>
    <div id="pop-win" style="position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:20000; display:none; align-items:center; justify-content:center; padding:30px;" onclick="this.style.display='none'">
        <div class="glass" style="text-align:center; padding:40px; border-color:var(--gold);"><div style="font-size:60px;">🏆</div><h2 style="font-family:'Bebas Neue'; font-size:45px; color:var(--gold);">NEW VICTORY!</h2><p id="pop-txt" style="font-weight:900;"></p><button class="btn-elite" style="margin-top:20px; font-size:22px;">CONTINUE</button></div>
    </div>
    <div id="view-login" style="padding: 60px 20px; text-align:center;">
        <h1 style="font-family:'Bebas Neue'; font-size:90px; letter-spacing:15px;">G.O.A.T.S</h1>
        <button class="glass" style="width:100%; color:var(--accent); font-weight:900;" onclick="startScan()">⚡ SCAN IDENTITY QR</button>
        <div id="reader" style="display:none; border-radius:20px; overflow:hidden;"></div>
        <select id="sel-dept" onchange="loadN()" style="width:100%; padding:22px; border-radius:15px; background:#000; color:#fff; margin-top:30px;"></select>
        <div id="n-box" style="display:none; margin-top:15px;"><select id="sel-name" style="width:100%; padding:22px; border-radius:15px; background:#000; color:#fff;"></select><button id="u-btn" class="btn-elite" style="margin-top:25px;" onclick="fetchU()">UPLINK SESSION</button></div>
    </div>
    <div id="view-dash" style="display:none; padding:15px;">
        <header id="main-h" style="display:flex; justify-content:space-between; align-items:center; padding:20px 10px;">
            <div style="display:flex; align-items:center; gap:10px;"><img id="h-logo" style="height:45px;"><img id="h-founder" style="height:50px; width:50px; border-radius:50%; border:2px solid var(--gold);"></div>
            <div style="text-align:right;"><p style="font-size:9px; opacity:0.4; font-weight:900;">BATTLE ARENA ACTIVE</p><p id="h-msg" style="font-size:11px; font-weight:900; color:var(--gold);"></p></div>
        </header>
        <div id="card-render"></div>
        <div style="padding:30px 0; text-align:center;"><p id="pill-h" style="font-weight:900; letter-spacing:6px; color:var(--house-col); font-size:12px;">HOUSE</p><h1 id="total-val" style="font-family:'Bebas Neue'; font-size:130px;">000</h1><h2 id="sn-display" style="font-family:'Bebas Neue'; font-size:40px; letter-spacing:6px;">PLAYER</h2></div>
        <div id="stats-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:15px;"></div>
        <h3 style="font-family:'Bebas Neue'; text-align:center; font-size:24px; margin:50px 0 20px 0; color:var(--gold);">COLLEGE OVERALL HOUSE LEADERBOARD</h3>
        <div class="glass" id="overall-lb"></div>
        <h3 style="font-family:'Bebas Neue'; text-align:center; font-size:24px; margin:40px 0 20px 0;">📜 ACHIEVEMENT LOGS</h3>
        <div id="logs-list"></div>
        <button class="btn-elite" style="background:#222; color:#fff; margin-top:80px;" onclick="localStorage.clear(); location.reload();">EXIT PORTAL</button>
    </div>
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwY7Ai0UWYbMDhnH6SInWbF7sri73yp8uF1gd9Hs3jdLcre2oLsyAAi1ty0aHscoOx16Q/exec";
        let appData={};
        const call=(p)=>fetch(API_URL,{method:"POST",body:JSON.stringify(p)}).then(res=>res.json());
        async function init(){
           const s=localStorage.getItem('g_sn'); if(s)fetchU(s);
           appData=await call({action:"getInitialData"}); document.getElementById('sp-img').src=appData.logo; document.getElementById('h-logo').src=appData.logo; document.getElementById('h-founder').src=appData.founder;
           const ds=document.getElementById('sel-dept'); ds.innerHTML='<option disabled selected>CHOOSE DEPARTMENT</option>';
           appData.depts.forEach(d=>ds.add(new Option(d,d))); setTimeout(()=>{document.getElementById('splash').style.transform='translateY(-110%)';},2000);
        }
        async function startScan(){ document.getElementById('reader').style.display='block'; scanner=new Html5Qrcode("reader"); await scanner.start({facingMode:"environment"},{fps:15},(tx)=>{ const p=tx.split('|'); scanner.stop(); fetchU(p[0].trim()); }); }
        async function loadN(){ const res=await call({action:"getStudentsByDept",dept:document.getElementById('sel-dept').value}); const ss=document.getElementById('sel-name'); ss.innerHTML=''; res.students.forEach(s=>ss.add(new Option(s.name,s.name))); document.getElementById('n-box').style.display='block'; }
        async function fetchU(n=null){
           const btn=document.getElementById('u-btn'); if(btn) btn.innerText="UPLINKING...";
           try {
               const name=n||document.getElementById('sel-name').value;
               const res=await call({action:"getStudentStats",name});
               localStorage.setItem('g_sn',name); localStorage.setItem('g_lt',res.total);
               renderH(res);
               document.getElementById('view-login').style.display='none';
               document.getElementById('view-dash').style.display='block';
           } catch(e) { alert("SYNC ERROR. REFRESH APP."); }
        }
        function renderH(res){
           document.getElementById('total-val').innerText=res.total; document.getElementById('sn-display').innerText=res.profile.name;
           if(res.rank <= 10) document.getElementById('h-msg').innerText="👑 TOP 10 ELITE ARCHIEVED!";
           const hC=appData.houses.find(h=>h.name===res.profile.house); if(hC){ document.documentElement.style.setProperty('--house-col',hC.color); document.getElementById('pill-h').innerText=hC.name; }
           const zone = document.getElementById('card-render');
           if(res.rank === 1) {
               zone.innerHTML = `<div id="cap"><div class="award-poster"><div class="cert-header"><img src="${appData.logo}" style="height:45px;"><div class="clg-title">DON BOSCO POLYTECHNIC COLLEGE<div style="font-size:8px; color:var(--gold);">GIVERS OF ALL TALENTS STUDENTS</div></div><img src="${appData.founder}" style="height:45px; width:45px; border-radius:50%; border:2px solid var(--gold);"></div><h1 class="award-main-title">BEST G.O.A.T.<br>AWARD</h1><p style="color:var(--gold); font-size:12px; font-weight:900; letter-spacing:4px;">OF THE WEEK</p><div class="portrait-zone"><div class="portrait-ring"></div><img id="avatar-img" class="portrait-img" src="https://via.placeholder.com/300"></div><div class="winner-banner">WINNER</div><p style="font-size:10px; opacity:0.8; margin-top:20px; line-height:1.6;">Congratulations! Your contribution for <span class="highlight">${res.profile.house}</span> house in <span class="highlight">${res.profile.dept}</span> securing <span class="highlight">${res.total} POINTS</span> makes you a true legend.</p></div></div><button class="btn-elite" style="margin-top:20px; font-size:22px;" onclick="saveImg()">💾 SAVE PHOTO</button><input type="file" id="ph" accept="image/*" hidden onchange="hAva(this)"><button class="glass" style="width:100%; margin-top:10px;" onclick="document.getElementById('ph').click()">📸 CONFIGURE PHOTO</button>`;
           } else {
               zone.innerHTML = `<div style="width:330px; height:410px; margin:20px auto; background:var(--card); border:2px solid rgba(255,255,255,0.1); border-radius:30px; padding:30px; text-align:center;"><h2 style="font-family:'Bebas Neue'; font-size:40px; color:var(--house-col);">${res.profile.name}</h2><p style="opacity:0.4; font-weight:900;">${res.profile.dept} / RANK #${res.rank}</p><div style="margin:20px 0;"><img id="avatar-img" src="https://via.placeholder.com/300" style="width:130px; height:130px; border-radius:50%; border:4px solid #fff; object-fit:cover;"></div><div style="display:flex; justify-content:space-around;"><div class="glass" style="padding:15px; margin:0;"><h4 style="color:var(--gold); font-size:24px;">${res.total}</h4><p style="font-size:9px;">SCORE</p></div><div class="glass" style="padding:15px; margin:0;"><h4 style="color:var(--accent); font-size:24px;">#${res.rank}</h4><p style="font-size:9px;">RANK</p></div></div></div><input type="file" id="ph" accept="image/*" hidden onchange="hAva(this)"><button class="glass" style="width:100%; margin-top:20px;" onclick="document.getElementById('ph').click()">📸 CONFIGURE PHOTO</button>`;
           }
           document.getElementById('stats-grid').innerHTML=['Activities','Discipline','Academics','Sports','Special'].map(c=>{ const col={'Activities':'#bf5af2','Discipline':'#32d74b','Academics':'#0a84ff','Sports':'#ff9f0a','Special':'#ff375f'}[c]||'#fff'; return `<div class="glass" style="text-align:center; border-bottom:4px solid ${col};"><h3 style="font-family:'Bebas Neue'; color:${col}; font-size:32px;">${res.breakdown[c]||0}</h3><p style="font-size:10px; opacity:0.3;">${c.toUpperCase()}</p></div>`; }).join('');
           const lb=(d)=>{ if(!d || d.length===0) return '<p style="text-align:center; opacity:0.3;">LOADING...</p>'; const m=d[0][1]||1; return d.map(([n,p])=>{ const c=appData.houses.find(h=>h.name===n)?.color||'#fff'; return `<div style="margin-bottom:20px;"><div style="display:flex; justify-content:space-between; font-weight:900; font-size:12px; margin-bottom:5px;"><span>${n.toUpperCase()}</span><span>${p} PTS</span></div><div class="bold-bar-container"><div class="bold-bar-fill" style="width:${(p/m*100)}%; background:${c};"></div></div></div>`; }).join(''); };
           document.getElementById('overall-lb').innerHTML=lb(res.overallLeaderboard);
           document.getElementById('logs-list').innerHTML=res.logs.map(l=>{ const isP=l.pts>0; return `<div class="glass" style="display:flex; justify-content:space-between; border-left:5px solid ${isP?'#32d74b':'#ff375f'};"><div style="flex:1;"><h4 style="font-family:'Bebas Neue'; color:${isP?'#32d74b':'#ff375f'}; font-size:20px;">${l.cat.toUpperCase()}</h4><p style="opacity:0.4; font-size:10px;">${l.date.split('T')[0]} • BY ${l.by}</p></div><div style="font-family:'Bebas Neue'; font-size:28px; color:${isP?'#32d74b':'#ff375f'};">${isP?'+':''}${l.pts}</div></div>`; }).join('');
        }
        function hAva(i){ if(i.files && i.files[0]){ const r=new FileReader(); r.onload=(e)=>document.getElementById('avatar-img').src=e.target.result; r.readAsDataURL(i.files[0]); } }
        function saveImg(){ html2canvas(document.querySelector("#cap")).then(c=>{ const l=document.createElement('a'); l.download='AWARD.png'; l.href=c.toDataURL(); l.click(); }); }
        setInterval(()=>{ const sn=localStorage.getItem('g_sn'); if(sn){ call({action:"getStudentStats",name:sn}).then(res=>{ if(res.total>parseInt(localStorage.getItem('g_lt')||0)){ localStorage.setItem('g_lt',res.total); confetti(); document.getElementById('pop-txt').innerText=`Winner! ${res.profile.name}, your points have increased!`; document.getElementById('pop-win').style.display='flex'; renderH(res); } }); } },30000);
        init();
    </script>
</body>
</html>
