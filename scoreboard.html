<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Live Scoreboard – Sports Day</title>
  <meta name="description" content="Live house points scoreboard for Sports Day"/>
  <link rel="stylesheet" href="styles.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <style>
    body { margin:0; }
    .scoreboard-root {
      min-height:100vh;
      background: radial-gradient(ellipse at 30% 10%, hsla(35,90%,30%,.35) 0%,transparent 55%),
                  radial-gradient(ellipse at 70% 80%, hsla(260,80%,30%,.3) 0%,transparent 55%),
                  hsl(220,15%,8%);
      padding: 2rem;
    }
    .scoreboard-header { text-align:center; margin-bottom:2rem; }
    .scoreboard-header h1 { font-family:'Outfit',sans-serif; font-size:clamp(1.6rem,4vw,3rem); }
    .scoreboard-header p  { color: var(--text-muted); }
    .header-logos { display:flex; justify-content:center; align-items:center; gap:1.5rem; margin-bottom:1rem; }
    .header-logos img { height:70px; border-radius:8px; }

    .score-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:1.5rem; margin-bottom:3rem; }
    .house-card {
      border-radius:16px;
      padding:2rem 1.5rem;
      text-align:center;
      position:relative;
      overflow:hidden;
      transition: transform .3s, box-shadow .3s;
      box-shadow: 0 8px 40px hsla(0,0%,0%,.4);
      cursor:default;
    }
    .house-card:hover { transform:translateY(-6px); box-shadow:0 16px 60px hsla(0,0%,0%,.5); }
    .house-card .rank-badge {
      font-size:2.8rem;
      font-family:'Outfit',sans-serif;
      font-weight:900;
      line-height:1;
    }
    .house-card .hname { font-size:1.3rem; font-weight:700; margin:.4rem 0 .6rem; }
    .house-card .pts   { font-size:3.2rem; font-weight:900; font-family:'Outfit',sans-serif; line-height:1; }
    .house-card .pts-label { font-size:.8rem; opacity:.7; letter-spacing:.1em; text-transform:uppercase; margin-top:.3rem; }
    .house-card .glow {
      position:absolute; inset:-30%; border-radius:50%;
      background:radial-gradient(circle,var(--hc, #f59e0b)22,transparent 60%);
      opacity:.15; pointer-events:none;
    }
    .rank-1 .glow { opacity:.25; }

    .chart-section { max-width:900px; margin:0 auto 3rem; }
    .chart-section .card { padding:2rem; }

    .recent-section { max-width:700px; margin:0 auto; }

    /* Winner overlay */
    .winner-overlay { position:fixed;inset:0;z-index:2000;background:hsla(220,15%,5%,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s; }
    .winner-overlay.show { opacity:1; pointer-events:all; }
    .winner-slide { width:min(460px,94vw); border-radius:20px; overflow:hidden; box-shadow:0 0 80px hsla(35,90%,55%,.4); animation:slideUp .5s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes slideUp { from{transform:translateY(80px) scale(.85);opacity:0} to{transform:none;opacity:1} }
    .winner-photo { width:100%; aspect-ratio:4/3; object-fit:cover; }
    .winner-info { padding:1.75rem; background:linear-gradient(135deg,hsla(35,90%,20%,.95),hsla(260,80%,20%,.95)); }
    .winner-tag  { font-size:.75rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent); font-weight:700; }
    .winner-name { font-family:'Outfit',sans-serif; font-size:2rem; font-weight:900; margin:.2rem 0; }
    .winner-meta { font-size:.95rem; color:var(--text-muted); }
    .winner-pts  { display:inline-block; margin-top:.6rem; background:var(--accent); color:#000; font-weight:800; padding:.3rem .9rem; border-radius:99px; font-size:1rem; }
    .winner-close { position:absolute; top:1rem; right:1.5rem; background:none; border:none; color:var(--text-muted); font-size:2rem; cursor:pointer; }

    #confetti-canvas { position:fixed;inset:0;pointer-events:none;z-index:1999; }
  </style>
</head>
<body>
<canvas id="confetti-canvas"></canvas>
<div class="scoreboard-root">
  <div class="scoreboard-header">
    <div class="header-logos">
      <img id="hdr-logo" src="" alt="Logo" onerror="this.style.display='none'"/>
      <div>
        <h1 id="hdr-college">🏆 Sports Day</h1>
        <p id="hdr-event">Live Scoreboard</p>
      </div>
      <img id="hdr-founder" src="" alt="Founder" style="border-radius:50%;border:3px solid var(--accent)" onerror="this.style.display='none'"/>
    </div>
    <div class="flex-center gap-2" style="flex-wrap:wrap">
      <button class="btn btn-secondary btn-sm" onclick="refresh()">🔄 Refresh</button>
      <span class="text-muted" id="last-updated" style="font-size:.8rem"></span>
      <button class="btn btn-secondary btn-sm" onclick="location.href='index.html'">🔐 Login</button>
    </div>
  </div>

  <!-- House Score Cards -->
  <div class="score-grid" id="score-grid"></div>

  <!-- Chart -->
  <div class="chart-section">
    <div class="card">
      <h3 class="mb-2">Points Breakdown</h3>
      <canvas id="chart-bar" height="120"></canvas>
    </div>
  </div>

  <!-- Recent Results -->
  <div class="recent-section card">
    <h3 class="mb-2">🎯 Recent Results</h3>
    <div class="table-wrap" id="recent-table"></div>
  </div>
</div>

<!-- Winner Overlay -->
<div class="winner-overlay" id="winner-overlay">
  <button class="winner-close" onclick="closeWinner()">✕</button>
  <div class="winner-slide" id="winner-slide">
    <img id="winner-photo" class="winner-photo" src="" alt="Winner photo" onerror="this.src='https://via.placeholder.com/460x345/1a1a2e/f59e0b?text=🏆'"/>
    <div class="winner-info">
      <div class="winner-tag" id="w-position"></div>
      <div class="winner-name" id="w-name"></div>
      <div class="winner-meta" id="w-meta"></div>
      <div class="winner-pts" id="w-pts"></div>
    </div>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>
<script src="api.js"></script>
<script>
let chartInstance = null;
let lastResultId  = null;
let scores=[], houses=[], results=[];

(async function init() {
  await loadBranding();
  await refresh();
  // Auto-refresh every 10 seconds
  setInterval(refresh, 10000);
})();

async function loadBranding() {
  try {
    const s = await getSettings();
    if (s.CollegeName) document.getElementById('hdr-college').textContent = '🏆 ' + s.CollegeName;
    if (s.EventTitle)  document.getElementById('hdr-event').textContent = s.EventTitle;
    if (s.LogoUrl)     document.getElementById('hdr-logo').src = s.LogoUrl;
    if (s.FounderUrl)  document.getElementById('hdr-founder').src = s.FounderUrl;
  } catch(e) {}
}

async function refresh() {
  try {
    const data = await apiGet('getScoreboard');
    scores  = data.scores  || [];
    houses  = data.houses  || [];
    const latest = data.lastResult;
    results = await apiGet('getResults');
    renderCards();
    renderChart();
    renderRecent();
    document.getElementById('last-updated').textContent = 'Updated: ' + new Date().toLocaleTimeString();
    // Check if there's a brand-new result to celebrate
    if (latest && latest.EventID && latest.EventID !== lastResultId) {
      lastResultId = latest.EventID + latest.StudentName + latest.Points;
      setTimeout(() => showWinner(latest), 400);
    }
  } catch(e) { console.error(e); }
}

function houseColor(name) {
  const h = houses.find(h=>h.HouseName===name);
  return h ? (h.Color||'#f59e0b') : '#f59e0b';
}

function renderCards() {
  const sorted = [...scores].sort((a,b)=>Number(b.Points)-Number(a.Points));
  const rankEmoji = ['🥇','🥈','🥉'];
  document.getElementById('score-grid').innerHTML = sorted.map((s,i)=>{
    const col = houseColor(s.House);
    return `<div class="house-card rank-${i+1}" style="--hc:${col};background:linear-gradient(135deg,${col}22,${col}08);border:2px solid ${col}44">
      <div class="glow"></div>
      <div class="rank-badge">${rankEmoji[i]||i+1}</div>
      <div class="hname">${s.House}</div>
      <div class="pts">${Number(s.Points).toLocaleString()}</div>
      <div class="pts-label">Points</div>
    </div>`;
  }).join('');
}

function renderChart() {
  const sorted = [...scores].sort((a,b)=>Number(b.Points)-Number(a.Points));
  const ctx = document.getElementById('chart-bar').getContext('2d');
  if (chartInstance) chartInstance.destroy();
  chartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: sorted.map(s=>s.House),
      datasets: [{
        data: sorted.map(s=>Number(s.Points)),
        backgroundColor: sorted.map(s=>houseColor(s.House)+'99'),
        borderColor: sorted.map(s=>houseColor(s.House)),
        borderWidth: 2,
        borderRadius: 10,
        borderSkipped: false
      }]
    },
    options: {
      responsive: true,
      plugins: { legend:{display:false} },
      scales: {
        x: { ticks:{color:'#9ca3af',font:{family:'Inter',weight:'600'}}, grid:{color:'rgba(255,255,255,.04)'} },
        y: { ticks:{color:'#9ca3af'}, grid:{color:'rgba(255,255,255,.04)'} }
      }
    }
  });
}

function renderRecent() {
  const recent = [...(results||[])].reverse().slice(0,8);
  document.getElementById('recent-table').innerHTML = recent.length
    ? `<table><thead><tr><th>Event</th><th>Position</th><th>Student</th><th>House</th><th>Points</th></tr></thead><tbody>
      ${recent.map(r=>`<tr>
        <td>${r.EventName}</td>
        <td><span class="badge ${r.Position==='1st'?'badge-gold':r.Position==='2nd'?'badge-purple':'badge-green'}">${r.Position}</span></td>
        <td>${r.StudentName}</td>
        <td style="color:${houseColor(r.House)};font-weight:600">${r.House}</td>
        <td><strong>+${r.Points}</strong></td>
      </tr>`).join('')}
      </tbody></table>`
    : '<p class="text-muted text-center">No results yet</p>';
}

function showWinner(r) {
  document.getElementById('w-position').textContent = r.Position + ' Place – ' + (r.IsTeam==='true'||r.IsTeam===true ? 'Team Event' : 'Individual');
  document.getElementById('w-name').textContent = r.StudentName;
  document.getElementById('w-meta').textContent = `${r.Department||''} · ${r.House} · ${r.EventName}`;
  document.getElementById('w-pts').textContent = '+' + r.Points + ' pts';
  if (r.PhotoUrl) document.getElementById('winner-photo').src = r.PhotoUrl;
  document.getElementById('winner-overlay').classList.add('show');
  fireConfetti();
  setTimeout(closeWinner, 8000);
}

function closeWinner() { document.getElementById('winner-overlay').classList.remove('show'); }
</script>
</body>
</html>
